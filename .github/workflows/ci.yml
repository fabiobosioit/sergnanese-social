name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Build, lint, test
    runs-on: macos-15 # standard GitHub-hosted Apple silicon runner
    timeout-minutes: 45
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Toolchain
        run: swift --version
      - name: Scripts/check.sh
        run: Scripts/check.sh
